
<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Apple Promo Control Test</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root {
  --bg:#f5f5f7;
  --surface:#fff;
  --text:#1d1d1f;
  --muted:#6e6e73;
  --line:#e5e5e8;
  --blue:#0071e3;
  --green:#248a46;
  --red:#d12c36;
}
* { box-sizing:border-box; }
body {
  margin:0;
  background:var(--bg);
  color:var(--text);
  font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}
.wrap { max-width:640px; margin:auto; padding:18px 14px 40px; }
.panel {
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:22px;
  padding:22px 18px;
  margin-bottom:14px;
}
h1 { font-size:29px; margin:0 0 5px; letter-spacing:-.5px; }
h2 { font-size:21px; margin:0 0 15px; }
h3 { font-size:18px; margin:0 0 8px; }
p { line-height:1.5; }
.muted { color:var(--muted); }
.hidden { display:none!important; }
.top {
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:10px;
}
.top > div { min-width:0; }
#refreshBtn {
  flex:0 0 auto;
  min-height:34px;
  padding:7px 10px;
  font-size:12px;
  font-weight:500;
  line-height:1.2;
  white-space:nowrap;
  border-radius:10px;
}
label.field { display:block; font-weight:650; margin:22px 0 9px; }
select,button { font:inherit; }
select {
  width:100%;
  padding:15px 13px;
  border:1px solid #d5d5d9;
  border-radius:14px;
  background:#fff;
  color:var(--text);
  min-height:54px;
}
button {
  border:0;
  border-radius:14px;
  min-height:49px;
  padding:12px 16px;
  cursor:pointer;
  font-weight:600;
}
button:disabled,select:disabled { opacity:.48; cursor:not-allowed; }
.primary { background:var(--blue); color:#fff; }
.secondary { background:#ededf0; color:var(--text); }
.full { display:block; width:100%; margin-top:15px; }
.actions { display:flex; flex-wrap:wrap; gap:9px; margin-top:20px; }
.actions button { flex:1; }
.category {
  font-size:21px;
  font-weight:700;
  padding:16px 0 6px;
  border-bottom:1px solid var(--line);
}
.item { padding:20px 0; border-bottom:1px solid var(--line); }
.item:last-child { border-bottom:0; }
.price { color:var(--muted); margin:8px 0 13px; }
.choice {
  display:flex;
  align-items:flex-start;
  gap:12px;
  padding:11px 0;
  cursor:pointer;
  line-height:1.35;
}
.choice input {
  width:21px;
  height:21px;
  margin:0;
  flex:none;
  accent-color:var(--blue);
}
.summary {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin:16px 0;
}
.metric { padding:14px; background:var(--bg); border-radius:13px; }
.metric strong { display:block; font-size:26px; margin-bottom:4px; }
.metric span { font-size:13px; color:var(--muted); }
.status-ok { color:var(--green); }
.message {
  margin-top:16px;
  font-size:14px;
  line-height:1.5;
  white-space:pre-line;
}
.error { color:var(--red); }
.link-button {
  display:block;
  text-align:center;
  text-decoration:none;
  background:#ededf0;
  color:var(--text);
  padding:15px;
  border-radius:14px;
  font-weight:650;
  margin-top:10px;
}
.photo-actions { display:flex; gap:8px; flex-wrap:wrap; margin-top:15px; }
.photo-actions button { flex:1; font-size:14px; }
.photo-list {
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:9px;
  margin-top:12px;
}
.photo-card { min-width:0; }
.photo-card img {
  width:100%;
  height:100px;
  object-fit:cover;
  border-radius:10px;
  border:1px solid var(--line);
}
.photo-card button {
  display:block;
  width:100%;
  min-height:34px;
  padding:5px;
  margin-top:4px;
  font-size:12px;
  background:#ededf0;
}
.photo-note { font-size:13px; color:var(--muted); margin-top:10px; }
.photo-required {
  color:var(--red);
  font-size:13px;
  font-weight:600;
  margin-top:9px;
}
.progress-track {
  height:8px;
  overflow:hidden;
  border-radius:20px;
  background:#e5e5e8;
  margin-top:12px;
}
.progress-fill {
  height:100%;
  width:0;
  background:var(--blue);
  border-radius:20px;
  transition:width .2s ease;
}
@media(max-width:380px) {
  .panel { padding:18px 14px; }
  h1 { font-size:25px; }
  button { font-size:14px; }
  #refreshBtn { font-size:12px; }
}
</style>
</head>
<body>
<main class="wrap">
  <section class="panel">
    <div class="top">
      <div>
        <h1>Актуальні промо</h1>
        <div class="muted">Apple Promo Control Test</div>
      </div>
      <button id="refreshBtn" class="secondary" type="button">↻ Оновити</button>
    </div>
    <p id="globalStatus" class="message muted" aria-live="polite">Завантаження...</p>
  </section>

  <section id="selectionView" class="panel">
    <h2>Нова перевірка</h2>
    <label class="field" for="employeeSelect">Співробітник</label>
    <select id="employeeSelect" disabled>
      <option value="">Оберіть співробітника</option>
    </select>
    <label class="field" for="storeSelect">Магазин</label>
    <select id="storeSelect" disabled>
      <option value="">Оберіть магазин</option>
    </select>
    <button id="startBtn" class="primary full" disabled>
      Ознайомитися з актуальними промо
    </button>
  </section>

  <section id="checklistView" class="panel hidden">
    <h2>Перевірка промо</h2>
    <p id="checklistInfo" class="muted"></p>
    <div id="checklistContent"></div>
    <div class="actions">
      <button id="backToSelectionBtn" class="secondary">Назад</button>
      <button id="reviewBtn" class="primary">Переглянути результати</button>
    </div>
  </section>

  <section id="reviewView" class="panel hidden">
    <h2>Перегляд перед надсиланням</h2>
    <div id="reviewInfo"></div>
    <div id="reviewSummary" class="summary"></div>
    <div class="actions">
      <button id="backToChecklistBtn" class="secondary">Повернутися</button>
      <button id="submitBtn" class="primary">Надіслати звіт</button>
    </div>
    <div id="progressTrack" class="progress-track hidden">
      <div id="progressFill" class="progress-fill"></div>
    </div>
    <p id="submitStatus" class="message" aria-live="polite"></p>
  </section>

  <section id="successView" class="panel hidden">
    <h2 class="status-ok">✓ Звіт успішно надіслано</h2>
    <a id="documentLink" class="link-button hidden"
       href="#" target="_blank" rel="noopener noreferrer">
      Переглянути свій звіт
    </a>
    <button id="newReportBtn" class="primary full">
      Створити новий звіт
    </button>
  </section>
</main>

<script>
"use strict";

const API_URL = "https://apple-promo-control-test.nass-mess53.workers.dev";
const telegram = window.Telegram?.WebApp || null;

if (telegram) {
  telegram.ready();
  telegram.expand();
}

const ANSWER_LABELS = {
  ok:"Оформлено, відповідає промо",
  no:"Не оформлено",
  missing:"Товар відсутній у магазині"
};

const MAX_PHOTO_BYTES = 5 * 1024 * 1024;
const MAX_PHOTOS_PER_ITEM = 3;
const MAX_PARALLEL_UPLOADS = 2;
const MAX_UPLOAD_ATTEMPTS = 3;
const UPLOAD_TIMEOUT_MS = 70000;

const state = {
  stores:[],
  employees:[],
  employee:"",
  apid:"",
  categories:[],
  answers:{},
  photos:{},
  reportId:"",
  submitting:false,
  completed:false
};

const $ = id => document.getElementById(id);

function el(tag,text,className = "") {
  const node = document.createElement(tag);
  if (text !== undefined && text !== null) {
    node.textContent = String(text);
  }
  if (className) node.className = className;
  return node;
}

function appendText(parent,tag,text,className = "") {
  const node = el(tag,text,className);
  parent.appendChild(node);
  return node;
}

function showView(id) {
  ["selectionView","checklistView","reviewView","successView"]
    .forEach(view => $(view).classList.toggle("hidden",view !== id));
  window.scrollTo(0,0);
}

function setStatus(message,error = false) {
  $("globalStatus").textContent = message;
  $("globalStatus").className = "message " + (error ? "error" : "muted");
}

function currentStore() {
  return state.stores.find(store => String(store.apid) === state.apid);
}

function storeLabel(store) {
  return store ? `${store.name} APID${store.apid}` : "";
}

function allItems() {
  return state.categories.flatMap(category => category.items || []);
}

function newId() {
  if (crypto.randomUUID) return crypto.randomUUID();
  const bytes = new Uint8Array(16);
  crypto.getRandomValues(bytes);
  return Array.from(bytes)
    .map(value => value.toString(16).padStart(2,"0"))
    .join("");
}

async function api(path,payload = {},options = {}) {
  const controller = new AbortController();
  const timeout = setTimeout(
    () => controller.abort(),
    options.timeout || 30000
  );

  try {
    const response = await fetch(API_URL + path,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        ...payload,
        initData:telegram?.initData || ""
      }),
      signal:controller.signal
    });

    let result;
    try {
      result = await response.json();
    } catch (_) {
      throw new Error("Сервер повернув некоректну відповідь");
    }

    if (!response.ok || !result.ok) {
      const error = new Error(result.error || "Помилка сервера");
      error.status = response.status;
      throw error;
    }
    return result;
  } catch (error) {
    if (error.name === "AbortError") {
      const timeoutError = new Error("Час очікування відповіді вичерпано");
      timeoutError.retryable = true;
      throw timeoutError;
    }
    if (error instanceof TypeError || error.status >= 500) {
      error.retryable = true;
    }
    throw error;
  } finally {
    clearTimeout(timeout);
  }
}

function fillSelect(select,placeholder,items,mapper) {
  select.replaceChildren(new Option(placeholder,""));
  items.forEach(item => {
    const option = mapper(item);
    select.add(new Option(option.label,option.value));
  });
}

function updateSelection() {
  state.employee = $("employeeSelect").value;
  state.apid = $("storeSelect").value;
  $("storeSelect").disabled = !state.employee;
  $("startBtn").disabled =
    !state.employee || !state.apid || !state.categories.length;
}

async function loadDirectory() {
  const result = await api("/stores");
  const uniqueStores = new Map();

  (result.stores || []).forEach(store => {
    const apid = String(store.apid || "").trim();
    if (apid && !uniqueStores.has(apid)) {
      uniqueStores.set(apid,{...store,apid});
    }
  });

  state.stores = [...uniqueStores.values()];
  state.employees = [...new Set(
    (result.employees || [])
      .map(name => String(name).trim())
      .filter(Boolean)
  )].sort((a,b) => a.localeCompare(b,"uk"));

  fillSelect(
    $("employeeSelect"),
    "Оберіть співробітника",
    state.employees,
    name => ({label:name,value:name})
  );

  fillSelect(
    $("storeSelect"),
    "Оберіть магазин",
    state.stores,
    store => ({label:storeLabel(store),value:store.apid})
  );

  $("employeeSelect").disabled = false;

  if (state.employees.includes(state.employee)) {
    $("employeeSelect").value = state.employee;
  }
  if (state.stores.some(store => store.apid === state.apid)) {
    $("storeSelect").value = state.apid;
  }
  updateSelection();
}

async function loadPromos() {
  const result = await api("/promos");
  if (!Array.isArray(result.categories)) {
    throw new Error("Невірний формат промопозицій");
  }
  state.categories = result.categories;
  updateSelection();
}

async function refreshData() {
  if (state.submitting) return;

  $("refreshBtn").disabled = true;
  setStatus("Завантаження даних...");

  try {
    await loadDirectory();
    await loadPromos();

    setStatus(
      `Співробітників: ${state.employees.length}. ` +
      `Магазинів: ${state.stores.length}. ` +
      `Промопозицій: ${allItems().length}.`
    );

    if (!$("checklistView").classList.contains("hidden")) {
      renderChecklist();
    }
  } catch (error) {
    setStatus(error.message,true);
  } finally {
    $("refreshBtn").disabled = false;
  }
}

function photoList(itemId) {
  if (!state.photos[itemId]) state.photos[itemId] = [];
  return state.photos[itemId];
}

function releasePhoto(photo) {
  if (photo?.url) URL.revokeObjectURL(photo.url);
}

function clearPhotos() {
  Object.values(state.photos).forEach(list => list.forEach(releasePhoto));
  state.photos = {};
}

function makePhotoId() {
  return newId().replace(/-/g,"");
}

function addPhotoControls(block,itemId) {
  const section = el("div");
  const actions = el("div",null,"photo-actions");
  const camera = el("button","📷 Зробити фото","secondary");
  const gallery = el("button","＋ Завантажити фото","secondary");

  camera.type = "button";
  gallery.type = "button";

  const cameraInput = document.createElement("input");
  cameraInput.type = "file";
  cameraInput.accept = "image/*";
  cameraInput.setAttribute("capture","environment");
  cameraInput.className = "hidden";

  const galleryInput = document.createElement("input");
  galleryInput.type = "file";
  galleryInput.accept = "image/*";
  galleryInput.multiple = true;
  galleryInput.className = "hidden";

  const previews = el("div",null,"photo-list");
  const note = el("div",null,"photo-note");
  const required = el("div",null,"photo-required");

  function renderPhotos() {
    previews.replaceChildren();
    const list = photoList(itemId);

    note.textContent =
      `Фото: ${list.length}/${MAX_PHOTOS_PER_ITEM}. ` +
      "Оригінали без стиснення, до 5 МБ кожен.";

    required.textContent =
      state.answers[itemId] === "ok" && !list.length
        ? "Для оформленої позиції додайте хоча б одне фото."
        : "";

    camera.disabled =
      state.submitting || list.length >= MAX_PHOTOS_PER_ITEM;
    gallery.disabled =
      state.submitting || list.length >= MAX_PHOTOS_PER_ITEM;

    list.forEach((photo,index) => {
      const card = el("div",null,"photo-card");
      const img = document.createElement("img");
      img.src = photo.url;
      img.alt = "Фото " + (index + 1);

      const remove = el("button","Видалити");
      remove.type = "button";
      remove.disabled = state.submitting;

      remove.addEventListener("click",() => {
        if (state.submitting) return;
        releasePhoto(photo);
        list.splice(index,1);
        renderPhotos();
      });

      card.append(img,remove);
      previews.appendChild(card);
    });
  }

  function receiveFiles(files) {
    if (state.submitting) return;
    const list = photoList(itemId);

    for (const file of files) {
      if (list.length >= MAX_PHOTOS_PER_ITEM) {
        alert("Максимум 3 фотографії на промопозицію");
        break;
      }

      const allowed = [
        "image/jpeg",
        "image/png",
        "image/webp",
        "image/heic",
        "image/heif"
      ];

      if (!allowed.includes(file.type)) {
        alert("Непідтримуваний формат фотографії");
        continue;
      }

      if (file.size > MAX_PHOTO_BYTES) {
        alert(
          `Фото "${file.name}" перевищує 5 МБ. ` +
          "Оригінал не змінено. Оберіть інше фото."
        );
        continue;
      }

      list.push({
        id:makePhotoId(),
        file,
        url:URL.createObjectURL(file),
        uploaded:false
      });
    }
    renderPhotos();
  }

  camera.addEventListener("click",() => cameraInput.click());
  gallery.addEventListener("click",() => galleryInput.click());

  cameraInput.addEventListener("change",() => {
    receiveFiles(cameraInput.files || []);
    cameraInput.value = "";
  });

  galleryInput.addEventListener("change",() => {
    receiveFiles(galleryInput.files || []);
    galleryInput.value = "";
  });

  actions.append(camera,gallery);
  section.append(actions,cameraInput,galleryInput,previews,note,required);
  block.appendChild(section);
  return renderPhotos;
}

function renderChecklist() {
  const store = currentStore();
  const content = $("checklistContent");
  content.replaceChildren();

  $("checklistInfo").textContent =
    `${storeLabel(store)}\nСпівробітник: ${state.employee}`;

  state.categories.forEach(category => {
    if (!category.items?.length) return;
    appendText(content,"div",category.name,"category");

    category.items.forEach(item => {
      const id = String(item.id);
      const block = el("div",null,"item");

      appendText(block,"h3",item.name);
      appendText(
        block,"div",
        `Промоціна: ${item.priceLabel || "Не зазначено"}`,
        "price"
      );

      const radioInputs = [];

      Object.entries(ANSWER_LABELS).forEach(([value,label]) => {
        const row = el("label",null,"choice");
        const input = document.createElement("input");

        input.type = "radio";
        input.name = "answer_" + id;
        input.value = value;
        input.checked = state.answers[id] === value;
        radioInputs.push(input);

        row.append(input,el("span",label));
        block.appendChild(row);
      });

      const renderPhotos = addPhotoControls(block,id);

      radioInputs.forEach(input => {
        input.addEventListener("change",() => {
          if (state.submitting) return;
          state.answers[id] = input.value;
          renderPhotos();
        });
      });

      content.appendChild(block);
    });
  });
}

function summary() {
  const items = allItems();
  return {
    total:items.length,
    correct:items.filter(
      item => state.answers[String(item.id)] === "ok"
    ).length,
    incorrect:items.filter(
      item => state.answers[String(item.id)] === "no"
    ).length,
    missing:items.filter(
      item => state.answers[String(item.id)] === "missing"
    ).length
  };
}

function renderMetrics(container,data) {
  container.replaceChildren();
  [
    [data.total,"Всього позицій"],
    [data.correct,"Правильно оформлено"],
    [data.incorrect,"Не оформлено"],
    [data.missing,"Товар відсутній"]
  ].forEach(([value,label]) => {
    const block = el("div",null,"metric");
    appendText(block,"strong",value);
    appendText(block,"span",label);
    container.appendChild(block);
  });
}

function validateReport() {
  const items = allItems();
  if (!items.length) return "Немає актуальних промопозицій";

  for (const item of items) {
    const id = String(item.id);
    const answer = state.answers[id];

    if (!Object.prototype.hasOwnProperty.call(ANSWER_LABELS,answer)) {
      return `Оберіть статус для позиції:\n${item.name}`;
    }

    if (answer === "ok" && !photoList(id).length) {
      return "Додайте щонайменше одне фото для позиції:\n" + item.name;
    }
  }
  return "";
}

function reviewReport() {
  const error = validateReport();
  if (error) {
    alert(error);
    return;
  }

  const info = $("reviewInfo");
  info.replaceChildren();
  appendText(info,"p",storeLabel(currentStore()));
  appendText(info,"p",`Співробітник: ${state.employee}`,"muted");
  renderMetrics($("reviewSummary"),summary());

  $("submitBtn").disabled = false;
  $("backToChecklistBtn").disabled = false;
  $("submitStatus").textContent = "";
  $("submitStatus").className = "message";
  $("progressTrack").classList.add("hidden");
  $("progressFill").style.width = "0%";

  showView("reviewView");
}

function fileToBase64(file) {
  return new Promise((resolve,reject) => {
    const reader = new FileReader();

    reader.onload = () => {
      const result = String(reader.result || "");
      const comma = result.indexOf(",");
      if (comma < 0) {
        reject(new Error("Не вдалося прочитати фотографію"));
        return;
      }
      resolve(result.slice(comma + 1));
    };

    reader.onerror = () => {
      reject(new Error("Помилка читання фотографії"));
    };

    reader.readAsDataURL(file);
  });
}

function countPhotos() {
  return Object.values(state.photos).reduce(
    (sum,list) => sum + list.length,0
  );
}

function updateProgress(done,total) {
  const percent = total ? Math.round(done / total * 100) : 100;
  $("progressTrack").classList.remove("hidden");
  $("progressFill").style.width = percent + "%";
  $("submitStatus").textContent =
    `Завантажено ${done} із ${total} фото`;
}

async function uploadSinglePhoto(itemId,photo) {
  if (photo.uploaded) return;

  const base64 = await fileToBase64(photo.file);
  let lastError;

  for (let attempt = 1; attempt <= MAX_UPLOAD_ATTEMPTS; attempt++) {
    try {
      const result = await api("/uploadPhoto",{
        reportId:state.reportId,
        apid:state.apid,
        employee:state.employee,
        itemId,
        photoId:photo.id,
        mimeType:photo.file.type,
        base64
      },{timeout:UPLOAD_TIMEOUT_MS});

      if (
        !result.uploaded ||
        result.photoId !== photo.id ||
        result.itemId !== itemId
      ) {
        throw new Error("Сервер не підтвердив фотографію");
      }

      photo.uploaded = true;
      return;
    } catch (error) {
      lastError = error;
      if (!error.retryable || attempt === MAX_UPLOAD_ATTEMPTS) break;
      await new Promise(resolve => setTimeout(resolve,attempt * 1200));
    }
  }

  throw lastError || new Error("Не вдалося завантажити фотографію");
}

async function uploadAllPhotos() {
  const entries = Object.entries(state.photos)
    .flatMap(([itemId,list]) =>
      list.map(photo => ({itemId,photo}))
    );

  const total = entries.length;
  let completed = entries.filter(entry => entry.photo.uploaded).length;
  const pending = entries.filter(entry => !entry.photo.uploaded);

  let nextIndex = 0;
  const errors = [];

  updateProgress(completed,total);

  async function uploadWorker() {
    while (nextIndex < pending.length) {
      const entry = pending[nextIndex++];

      try {
        await uploadSinglePhoto(entry.itemId,entry.photo);
      } catch (error) {
        errors.push(error);
      } finally {
        if (entry.photo.uploaded) completed++;
        updateProgress(completed,total);
      }
    }
  }

  const concurrency = Math.min(MAX_PARALLEL_UPLOADS,pending.length);
  await Promise.all(
    Array.from({length:concurrency},() => uploadWorker())
  );

  if (errors.length) {
    throw new Error(
      `Не вдалося завантажити ${errors.length} фото. ` +
      "Натисніть «Надіслати звіт» ще раз."
    );
  }
}

function setReportLink(url) {
  const link = $("documentLink");
  const valid =
    typeof url === "string" &&
    /^https:\/\/docs\.google\.com\//.test(url);

  link.classList.toggle("hidden",!valid);
  if (valid) link.href = url;
  else link.removeAttribute("href");
}

async function submitReport() {
  if (state.submitting || state.completed) return;

  const validationError = validateReport();
  if (validationError) {
    alert(validationError);
    renderChecklist();
    showView("checklistView");
    return;
  }

  if (!state.reportId) state.reportId = newId();

  state.submitting = true;
  $("submitBtn").disabled = true;
  $("backToChecklistBtn").disabled = true;
  $("refreshBtn").disabled = true;

  try {
    if (countPhotos()) await uploadAllPhotos();

    $("submitStatus").textContent = "Формування звіту...";

    const result = await api("/save",{
      reportId:state.reportId,
      apid:state.apid,
      employee:state.employee,
      answers:state.answers
    },{timeout:70000});

    if (!result.saved) {
      throw new Error("Сервер не підтвердив збереження звіту");
    }

    state.completed = true;
    setReportLink(result.documentUrl);
    showView("successView");
    clearPhotos();

  } catch (error) {
    $("submitStatus").textContent =
      "Не вдалося завершити звіт: " +
      error.message +
      "\nСпробуйте надіслати ще раз.";
    $("submitStatus").className = "message error";
  } finally {
    state.submitting = false;
    $("submitBtn").disabled = state.completed;
    $("backToChecklistBtn").disabled = state.completed;
    $("refreshBtn").disabled = false;
  }
}

function resetReport() {
  clearPhotos();

  state.apid = "";
  state.answers = {};
  state.reportId = "";
  state.completed = false;
  state.submitting = false;

  $("storeSelect").value = "";
  $("submitBtn").disabled = false;
  $("backToChecklistBtn").disabled = false;
  $("backToSelectionBtn").disabled = false;
  $("reviewBtn").disabled = false;

  $("submitStatus").textContent = "";
  $("submitStatus").className = "message";
  $("progressTrack").classList.add("hidden");
  $("progressFill").style.width = "0%";
  setReportLink("");

  updateSelection();
  showView("selectionView");
}

$("employeeSelect").addEventListener("change",() => {
  $("storeSelect").value = "";
  updateSelection();
});

$("storeSelect").addEventListener("change",updateSelection);
$("refreshBtn").addEventListener("click",refreshData);

$("startBtn").addEventListener("click",() => {
  clearPhotos();
  state.answers = {};
  state.reportId = newId();
  state.completed = false;

  $("submitBtn").disabled = false;
  $("backToChecklistBtn").disabled = false;
  $("submitStatus").textContent = "";
  $("progressTrack").classList.add("hidden");
  $("progressFill").style.width = "0%";

  renderChecklist();
  showView("checklistView");
});

$("backToSelectionBtn").addEventListener("click",() => {
  if (countPhotos() || Object.keys(state.answers).length) {
    if (!confirm(
      "Повернутися? Незавершені відповіді та фото буде втрачено."
    )) return;
  }

  clearPhotos();
  state.answers = {};
  state.reportId = "";
  showView("selectionView");
});

$("reviewBtn").addEventListener("click",reviewReport);

$("backToChecklistBtn").addEventListener("click",() => {
  renderChecklist();
  showView("checklistView");
});

$("submitBtn").addEventListener("click",submitReport);
$("newReportBtn").addEventListener("click",resetReport);

refreshData();
</script>
</body>
</html>
